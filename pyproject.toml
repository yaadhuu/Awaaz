[project]
name = "tinytalk"
version = "0.1.0"
description = "TinyTalk: voice messages over weak links by sending text (or critical facts) instead of audio."
requires-python = ">=3.10"
dependencies = [
    "diskcache>=5.6.3",
    "fastapi>=0.162.2",
    "gnani-vachana>=0.9.0",
    "httpx>=0.28.1",
    "indic-nlp-library>=0.92",
    "indic-transliteration>=2.3.82",
    "jiwer>=4.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pycodec2>=4.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "reedsolo>=1.7.0",
    "regex>=2026.9.29",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "soxr>=1.1.0",
    "statsmodels>=0.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
    "webrtcvad-wheels>=2.0.14.post1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
audio = [
    "audiomentations>=0.30.0",
    "pystoi>=0.4.1",
]

[tool.uv]
# Not installed as a package until Stage 0 creates the tinytalk/ folder.
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["web", "tools"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["web/", "tools/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
