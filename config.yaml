# The only place for settings. Values come from CLAUDE.md and docs/BUILD_PLAYBOOK.md.
# null means "not decided yet" (see Open questions in docs/DIARY.md).

languages: [ml-IN, hi-IN, en-IN]

models:
  stt: prisma-v3.0
  tts: timbre-v3.0


tts_speeds: [0.85, 1.0, 1.15]

paths:
  results: results
  cache: cache
  ledger: results/ledger.jsonl
  corpus: data/corpus

credits:
  max_calls: 4        # smoke-test cap; raise before the pilot
  max_credits: null   # needs the credit conversion rate; not given yet

concurrency:
  stt: 1              # Gnani allows one active request at a time per account (docs, errors page)
  tts: 1

clip_max_seconds: 30  # Prisma limit

link:
  rates_kbps: [2, 5, 10]
  loss_percent: [0, 10, 20, 30]
  max_resends: 3
  mean_burst_packets: 3  # Gilbert-Elliott: average length of a loss burst
  payload_bytes: 48      # bytes of data per packet
  header_bytes: 4        # 2 sequence number + 2 CRC16

codec:
  codec2_mode: 2400
  opus_kbps: 6

malayalam_min_exact_facts: 0.85

split:
  dev_fraction: 0.3
  test_fraction: 0.7

seeds:
  split: 1108
  link: 2026
  bootstrap: 7

tier_picker:
  audio_max_loss_percent: 10  # above this, audio is too damaged to trust
  text_max_airtime_s: 10      # longest we accept to send a transcript before falling back to facts

pilot:
  messages_per_language: 10
  voice_index: 0
  speed: 1.0
  split: dev

voices: [Vasudha, Avinash, Lakshmi]  # timbre-v3.0 voices: two female, one male
stt_conditions: [off, both]          # context off; keyterms + topic. (also: keyterms, topic)
tts_audio_config:
  sample_rate: 16000
  encoding: linear_pcm
  num_channels: 1
  sample_width: 2
  container: wav
