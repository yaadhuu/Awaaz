# The only place for settings. Values come from CLAUDE.md and docs/BUILD_PLAYBOOK.md.
# null means "not decided yet" (see Open questions in docs/DIARY.md).

languages: [ml-IN, hi-IN, en-IN]

models:
  stt: prisma-v3.0
  tts: timbre-v3.0


tts_speeds: [0.85, 1.0, 1.15]

paths:
  results: results
  cache: cache
  ledger: results/ledger.jsonl
  corpus: data/corpus

credits:
  max_calls: 4        # smoke-test cap used by scripts/smoke_gnani.py only
  starting_balance: 5000          # credits at the start (Yadhu); calibrate from the dashboard in /usage
  credits_per_audio_second: null  # Prisma; not published by Gnani, set once known
  credits_per_1k_chars: null      # Timbre; not published by Gnani, set once known
  cap_credits: 4500               # hard stop for estimated credits spent (needs the rates)
  cap_calls: 1200                 # hard stop for total live attempts in the ledger while rates are unknown
  warn_at: [0.5, 0.8, 0.95]       # warn at these shares of the cap
  confirm_above: 25               # ask for a confirm click above this estimate (credits, or calls)
  calibration_file: results/credit_calibration.json

live:
  daily_call_cap: 100             # live attempts per day across all users
  per_ip_per_minute: 6
  max_upload_bytes: 5000000
  max_audio_seconds: 30
  upload_types: [audio/wav, audio/x-wav, audio/wave, audio/mpeg, audio/ogg, audio/webm, audio/flac, audio/mp4]

concurrency:
  stt: 1              # Gnani allows one active request at a time per account (docs, errors page)
  tts: 1

clip_max_seconds: 30  # Prisma limit

link:
  rates_kbps: [2, 5, 10]
  loss_percent: [0, 10, 20, 30]
  max_resends: 3
  mean_burst_packets: 3  # Gilbert-Elliott: average length of a loss burst
  payload_bytes: 48      # bytes of data per packet
  header_bytes: 4        # 2 sequence number + 2 CRC16

codec:
  codec2_mode: 2400
  opus_kbps: 6

malayalam_min_exact_facts: 0.85

split:
  dev_fraction: 0.3
  test_fraction: 0.7

seeds:
  split: 1108
  link: 2026
  bootstrap: 7

tier_picker:
  audio_max_loss_percent: 10  # above this, audio is too damaged to trust
  text_max_airtime_s: 10      # longest we accept to send a transcript before falling back to facts

pilot:
  messages_per_language: 10
  voice_index: 0
  speed: 1.0
  split: dev

voices: [Vasudha, Avinash, Lakshmi]  # timbre-v3.0 voices: two female, one male
stt_conditions: [off, both]          # context off; keyterms + topic. (also: keyterms, topic)
tts_audio_config:
  sample_rate: 16000
  encoding: linear_pcm
  num_channels: 1
  sample_width: 2
  container: wav
